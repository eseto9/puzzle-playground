<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wits' End</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2FB;--surface:#FFFFFF;--surface2:#ECE8F7;--ink:#1B1730;--muted:#625E7C;--line:#DAD5EC;--line-strong:#B9B3D3;
  --you:#E0420F;--you-soft:#FFE4DB;--rival:#1B63E8;--rival-soft:#DDE8FD;--ok:#0F8F62;--bad:#D6303A;--glow:#FFC83D;--pipe-off:#A7A2C2;
  --font-d:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-b:'Instrument Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12101C;--surface:#1C1930;--surface2:#2A2645;--ink:#F1EEFF;--muted:#A6A2C4;--line:#2F2B4B;--line-strong:#4A4570;
    --you:#FF7A55;--you-soft:#3A2119;--rival:#6AA0FF;--rival-soft:#1B2A4D;--ok:#3DD6A0;--bad:#FF6B73;--glow:#FFC83D;--pipe-off:#5A557F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12101C;--surface:#1C1930;--surface2:#2A2645;--ink:#F1EEFF;--muted:#A6A2C4;--line:#2F2B4B;--line-strong:#4A4570;
  --you:#FF7A55;--you-soft:#3A2119;--rival:#6AA0FF;--rival-soft:#1B2A4D;--ok:#3DD6A0;--bad:#FF6B73;--glow:#FFC83D;--pipe-off:#5A557F;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-b);min-height:100vh}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rival);outline-offset:2px}
.hide{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 48px}

/* buttons */
.btn{font:600 15px var(--font-b);border:0;border-radius:12px;padding:12px 16px;min-height:46px;background:var(--ink);color:var(--bg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.you{background:var(--you);color:#fff}
.btn.rival{background:var(--rival);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.38;cursor:not-allowed}
.icon-btn{width:42px;height:42px;border-radius:12px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;cursor:pointer;flex:none}

/* header */
.brand{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.brand .dots{display:flex}
.brand .dots i{width:18px;height:18px;border-radius:50%;display:block}
.brand .dots i:first-child{background:var(--you)}
.brand .dots i:last-child{background:var(--rival);margin-left:-6px;mix-blend-mode:normal;box-shadow:0 0 0 2px var(--bg)}
.brand b{font:800 22px var(--font-d);letter-spacing:-.02em}
.brand .streak{margin-left:auto;font-size:14px;color:var(--muted)}

h1,h2,h3{font-family:var(--font-d);letter-spacing:-.02em;margin:0}
h2{font-size:21px;font-weight:700}
.sec{margin-top:26px}
.sec>h2{margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* hero */
.hero{background:var(--surface);border-radius:26px;padding:20px 18px 18px;box-shadow:inset 0 0 0 1px var(--line)}
.hero h1{font-size:33px;line-height:1.02;font-weight:800;margin:2px 0 16px;max-width:15ch}
.lanes{display:grid;gap:9px;margin-bottom:18px}
.lane-row{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;font-size:13px;font-weight:600}
.lane{height:16px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden}
.lane i{position:absolute;inset:0 auto 0 0;width:var(--to,50%);border-radius:99px;display:block}
.lane.you i{background:var(--you)}
.lane.rival i{background:var(--rival)}
.lane::after{content:"";position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/7px 7px;opacity:.85}
@media (prefers-reduced-motion:no-preference){
  .lane i{animation:race 2.2s cubic-bezier(.25,.7,.15,1) both}
  .lane.rival i{animation-duration:2.6s;animation-delay:.1s}
}
@keyframes race{from{width:0}to{width:var(--to,50%)}}
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{margin-top:12px;font-size:14px;color:var(--muted)}

/* cards */
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:inset 0 0 0 1px var(--line)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px}
.trio .t{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;font-weight:600;line-height:1.2}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tc,var(--ink));background:var(--surface2);background:color-mix(in srgb,var(--tc,#888) 15%,var(--surface))}
.ico svg{width:22px;height:22px}
.tabs{display:flex;gap:6px;margin:16px 0 8px}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:99px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.board{display:grid;gap:2px}
.brow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;font-size:15px}
.brow.me{background:var(--you-soft);font-weight:600}
.brow .rk{font:700 15px var(--font-d);color:var(--muted)}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .sc{font:700 15px var(--font-d);text-align:right}
.brow .sc small{display:block;font:500 12px var(--font-b);color:var(--muted)}
.empty{padding:14px 4px;color:var(--muted);font-size:15px}
.note{font-size:13px;color:var(--muted);margin-top:8px}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:11px;cursor:pointer;min-height:64px}
.tile b{font:700 15px/1.15 var(--font-d);display:block}
.tile span.d{font-size:12.5px;color:var(--muted);line-height:1.25;display:block;margin-top:2px}
.tile .lv{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);align-self:flex-start}
.tile.wide{grid-column:1/-1;background:var(--surface2)}

/* topbar + play */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.topbar .ttl{font:700 19px var(--font-d);letter-spacing:-.01em;min-width:0;flex:1}
.topbar .sub{font-size:13px;color:var(--muted);font-weight:500;display:block;font-family:var(--font-b);letter-spacing:0}
.clock{font:800 22px var(--font-d);font-variant-numeric:tabular-nums}
.chip{font-size:13px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.chip.pen{background:var(--you-soft);color:var(--you)}
.duel-lanes{display:grid;gap:7px;margin:0 0 12px}
.duel-lanes .lane-row{grid-template-columns:70px 1fr;font-size:13px}
.duel-lanes .lane{height:12px}
.duel-lanes .lane i{animation:none;width:0;transition:width .45s ease}
.how{font-size:14.5px;color:var(--muted);margin:0 0 12px;max-width:52ch}
.stagewrap{position:relative}
.stage{background:var(--surface);border-radius:20px;padding:14px;box-shadow:inset 0 0 0 1px var(--line);min-height:240px}
.overlay{position:absolute;inset:0;border-radius:20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;text-align:center;z-index:5;padding:20px}
.overlay .big{font:800 64px/1 var(--font-d)}
.overlay .msg{font:700 24px/1.15 var(--font-d);max-width:18ch}
.overlay .sm{font-size:15px;color:var(--muted);margin-top:8px;font-weight:500;font-family:var(--font-b)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,8,20,.55);display:grid;place-items:center;z-index:40;padding:20px}
.modal .box{background:var(--surface);border-radius:20px;padding:20px;max-width:340px;width:100%}
.modal .box p{margin:0 0 16px;font-size:16px}
.modal .row{display:flex;gap:10px}
.modal .row .btn{flex:1}

/* result */
.result{text-align:center;padding:26px 18px}
.result h1{font-size:34px;margin:4px 0 6px}
.result .big{font:800 52px/1 var(--font-d);font-variant-numeric:tabular-nums;margin:10px 0 4px}
.result .stack{display:grid;gap:10px;margin-top:20px}
.pillrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.win{color:var(--ok)}.lose{color:var(--bad)}

/* lobby */
.code{font:800 54px/1 var(--font-d);letter-spacing:.14em;text-align:center;margin:14px 0 6px;padding-left:.14em}
.field{width:100%;font:700 26px var(--font-d);letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:12px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1.5px var(--line-strong);background:var(--surface);color:var(--ink)}
.field::placeholder{letter-spacing:.1em;color:var(--muted);font-weight:500;font-size:18px;text-transform:none}
.who{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line-strong);display:inline-block}
.dot.on{background:var(--ok)}

/* ===== jungle game ===== */
.stage{padding:10px}
.jgrid{display:grid;grid-template-columns:minmax(0,1fr) clamp(38px,11vw,50px) minmax(0,var(--bf,1.1fr));gap:8px;align-items:start}
.tray{display:flex;flex-direction:column;gap:6px}
.slot{width:100%;aspect-ratio:1;border:0;border-radius:50%;background:var(--surface2);display:grid;place-items:center;cursor:pointer;padding:0}
.slot.used{opacity:.28}
.slot.sel{box-shadow:0 0 0 3px var(--ink)}
.tok{--c:#888;display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--c);font-size:clamp(18px,5.4vw,26px);line-height:1}
.tok.sel{box-shadow:inset 0 0 0 3px var(--c),0 0 0 3px var(--ink)}
.jb{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:4px}
.cell{position:relative;aspect-ratio:1;border:0;border-radius:12px;padding:0;cursor:pointer;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.cell .tok{width:68%;height:68%;font-size:clamp(18px,6vw,32px);box-shadow:inset 0 0 0 3px var(--c),0 2px 6px rgba(0,0,0,.28)}
.cell .tl{position:absolute;left:6px;bottom:3px;font:700 9px var(--font-b);color:rgba(0,0,0,.55)}
.cell.jungle .tl,.cell.rock .tl,.cell.mud .tl{color:rgba(255,255,255,.9)}
.cell .palm{position:absolute;right:4px;top:2px;font-size:clamp(11px,3.4vw,18px)}
.cell.tgt{outline:2.5px dashed var(--ink);outline-offset:-5px}
.cell.grass,.sw-t.grass{background:repeating-linear-gradient(115deg,#D7EE78 0 7px,#C4E05A 7px 13px)}
.cell.jungle,.sw-t.jungle{background:radial-gradient(circle at 25% 30%,#58B04C 0 18%,transparent 19%),radial-gradient(circle at 72% 70%,#2F8A3D 0 22%,transparent 23%),#3F9A40}
.cell.rock,.sw-t.rock{background:radial-gradient(circle at 30% 35%,#B9B9C2 0 22%,transparent 23%),radial-gradient(circle at 70% 70%,#85858F 0 26%,transparent 27%),#9C9CA6}
.cell.mud,.sw-t.mud{background:radial-gradient(circle at 50% 50%,#8A5A31 0 45%,transparent 46%),#A9794A}
/* visual clues */
.clues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.clue{--tk:clamp(24px,7.2vw,34px);position:relative;display:flex;align-items:center;justify-content:center;min-height:clamp(58px,17vw,84px);padding:5px;border-radius:12px;background:var(--surface2)}
.clue.bad{background:var(--you-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.clue .tok{width:var(--tk);height:var(--tk);font-size:calc(var(--tk)*.6);flex:none;box-shadow:inset 0 0 0 2.5px var(--c)}
.mmw{display:block;line-height:0;max-width:56%}
.clue .mm{height:clamp(46px,14vw,70px);width:auto;max-width:100%;display:block}
.mmw+.tok,.mmw+.neg,.sw-t+.tok,.sw-t+.neg{margin-left:calc(var(--tk)*-.5);align-self:flex-end}
.neg{position:relative;display:inline-block}
.neg::before,.neg::after{content:"";position:absolute;left:50%;top:50%;width:125%;height:3.5px;border-radius:3px;background:var(--bad);box-shadow:0 0 0 1.5px rgba(255,255,255,.85);pointer-events:none}
.neg::before{transform:translate(-50%,-50%) rotate(45deg)}
.neg::after{transform:translate(-50%,-50%) rotate(-45deg)}
.neg.zero{position:absolute;inset:0;display:block}
.neg.zero::before,.neg.zero::after{width:70%}
.cl-above{display:flex;flex-direction:column;align-items:center;gap:2px}
.cl-above .ab{display:flex;align-items:center;gap:3px}
.arr{font-style:normal;color:#1F7A7A;font-size:calc(var(--tk)*.55);line-height:1}
.lnk{display:block;color:var(--muted);line-height:0}
.lnk svg{width:15px;height:8px}
.cl-adj{display:flex;align-items:center;gap:5px}
.cl-adj .st{display:flex;flex-direction:column;gap:3px}
.cl-adj svg{width:calc(var(--tk)*1.35);height:calc(var(--tk)*1.35);display:block}
.sw-t{position:relative;display:block;flex:none;width:calc(var(--tk)*1.5);height:calc(var(--tk)*1.5);border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.sw-t.big{width:calc(var(--tk)*1.9);height:calc(var(--tk)*1.9);overflow:visible;border-radius:12px}
.cnt{position:absolute;width:52%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #4a4a55;display:grid;place-items:center;font:800 13px var(--font-d);color:#222;font-style:normal}
.cnt.big{width:56%}
@media (max-width:360px){.clue{--tk:22px}}

/* ===== v3: icons in front, captions, creative clue cards ===== */
.tok{position:relative;z-index:2}
.cell .tl,.cell .palm{z-index:0}
.cell .tok{z-index:3}
.clue.cp{flex-direction:column;gap:3px;padding:6px 4px 5px;min-height:clamp(66px,19vw,92px)}
.clue .cin{display:flex;align-items:center;justify-content:center;flex:1;width:100%}
.cap{font:700 9.5px/1.1 var(--font-b);color:var(--muted);text-align:center;letter-spacing:0}
.clue.bad .cap{color:var(--bad)}
.nb{position:relative;z-index:3;margin-left:calc(var(--tk)*-.45);align-self:flex-end;width:calc(var(--tk)*.8);height:calc(var(--tk)*.8);border-radius:50%;background:#fff;color:#222;font:800 14px var(--font-d);display:grid;place-items:center;box-shadow:0 0 0 2px #4a4a55}
.cl-pair{display:flex;align-items:center;gap:3px}
.cl-pair.v{flex-direction:column;gap:1px}
.bar-h svg{width:calc(var(--tk)*.8);height:10px;display:block}
.bar-v svg{width:10px;height:calc(var(--tk)*.7);display:block}
.eq{font:800 20px var(--font-d);color:#1F7A7A;font-style:normal}
.cl-diag{position:relative;width:calc(var(--tk)*2);height:calc(var(--tk)*2)}
.cl-diag .tok{position:absolute}
.cl-diag .tok:first-child{left:0;top:0}
.cl-diag .tok:last-child{right:0;bottom:0}
.cl-diag .dline{position:absolute;left:18%;right:18%;top:50%;border-top:2px dashed #1F7A7A;transform:rotate(45deg);z-index:1}
.cl-next{display:flex;align-items:center;gap:3px}
.cl-next .x4 svg{width:calc(var(--tk)*.7);height:calc(var(--tk)*.7);display:block}
.cl-alone{display:grid;grid-template-columns:repeat(3,calc(var(--tk)*.78));grid-template-rows:repeat(3,calc(var(--tk)*.78));gap:2px}
.cl-alone>i{display:block;border:2px dashed var(--line-strong);border-radius:6px}
.cl-alone>i:nth-child(1){grid-area:1/2}.cl-alone>i:nth-child(2){grid-area:2/1}.cl-alone>i:nth-child(3){grid-area:2/3}.cl-alone>i:nth-child(4){grid-area:3/2}
.cl-alone .ctr{grid-area:2/2;display:grid;place-items:center}
.cl-alone .ctr .tok{width:100%;height:100%;font-size:calc(var(--tk)*.5)}

/* ===== alibi ===== */
.al{display:grid;gap:5px;margin-bottom:12px}
.al-head,.al-row{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center}
.al-pm{font:700 11px var(--font-b);color:var(--muted);text-align:center}
.al-hours{display:grid;grid-template-columns:repeat(var(--T),1fr)}
.al-hours span{font:700 12px var(--font-d);text-align:center;color:var(--muted)}
.al-who{display:flex;align-items:center;gap:3px}
.al-who .tok{width:30px;height:30px;font-size:18px;flex:none}
.al-who small{font:700 11px var(--font-b);color:var(--muted)}
.al-track{position:relative;display:grid;grid-template-columns:repeat(var(--T),1fr);height:38px;border-radius:10px;background:var(--surface2);overflow:hidden}
.al-cell{border:0;background:transparent;box-shadow:inset -1px 0 0 var(--line);cursor:pointer;padding:0}
.al-cell:last-of-type{box-shadow:none}
.al-bar{position:absolute;top:4px;bottom:4px;left:calc(var(--s,0)/var(--T)*100% + 2px);width:calc(var(--d)/var(--T)*100% - 4px);border-radius:8px;background:var(--c);display:none;align-items:center;justify-content:center;color:#fff;font:800 12px var(--font-d);pointer-events:none;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.al-bar.on{display:flex}
.clues.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.al-c .cin{gap:4px}
.al-c .st{display:flex;flex-direction:column;gap:3px;flex:none}
.al-c .tok{width:22px;height:22px;font-size:13px;box-shadow:inset 0 0 0 2px var(--c)}
.alsv{display:block;flex:1;min-width:0;color:var(--muted);line-height:0}
.alsv svg{width:100%;height:auto;display:block}

/* ===== race hud, results, home bits ===== */
.race-hud{display:grid;gap:8px;margin:0 0 10px}
.rrow .rtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:3px}
.rrow .rtop b{font:700 13px var(--font-d)}
.rrow .rst{font-size:12.5px;color:var(--muted);font-weight:600;text-align:right}
.rrow .lane{height:10px}
.rrow .lane i{animation:none;width:0;transition:width .4s ease}
.rtimes{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.tm{font:700 12px var(--font-b);padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tm.ok{background:var(--ink);color:var(--bg)}
.tm.now{box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.rtab{width:100%;border-collapse:collapse;margin:14px 0 4px;font-size:15px;text-align:left}
.rtab th{font:700 13px var(--font-b);color:var(--muted);padding:6px 4px}
.rtab td{padding:9px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.rtab td.best{font-weight:800;color:var(--ok)}
.rtab tr.tot td{font:800 16px var(--font-d);border-top:2px solid var(--line-strong)}
.rtab th:not(:first-child),.rtab td:not(:first-child){text-align:right}
.today{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.today b{font:700 18px var(--font-d)}
.gem{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;font-size:24px;flex:none;background:color-mix(in srgb,var(--tc,#888) 18%,var(--surface))}
.tile .gem{width:40px;height:40px;font-size:21px}

/* ===== bridges (ocean scene) ===== */
.br{max-width:440px;margin:0 auto}
.brs{max-height:58vh;touch-action:none;border-radius:16px;box-shadow:0 6px 22px rgba(10,79,124,.28)}
.br-waves{animation:drift 14s linear infinite}
@keyframes drift{to{transform:translateX(-10px)}}
.br-spark{opacity:0;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:.85}}
.br-e .br-ghost{display:none;stroke:#fff;stroke-opacity:.55;stroke-width:.5;stroke-dasharray:1.1 1.2;stroke-linecap:round;pointer-events:none}
.br-e.avail .br-ghost{display:block}
.br-e.hot.avail .br-ghost{stroke:#FFE08A;stroke-opacity:1;stroke-width:.9}
.br-e .br-hit{stroke:transparent;stroke-width:7;cursor:pointer;pointer-events:none}
.br-e.avail .br-hit,.br-e.built .br-hit{pointer-events:stroke}
.br-e .br-badge{display:none;cursor:pointer}
.br-e.avail .br-badge{display:block}
.br-badge circle{fill:#fff;fill-opacity:.94;stroke:#0A4F7C;stroke-width:.35}
.br-badge path{stroke:#0A4F7C;stroke-width:.6;stroke-linecap:round}
.br-e.hot.avail .br-badge circle{fill:#FFE08A}
.br-e.pulse .br-badge circle{animation:pop 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
.br-br{animation:plankin .25s ease-out;pointer-events:none}
@keyframes plankin{from{opacity:0}to{opacity:1}}
.br-i{cursor:pointer;outline:none}
.br-i .halo{opacity:0;pointer-events:none}
.br-i .grass{fill:url(#brIsl)}
.br-i text{font:800 5.6px var(--font-d);text-anchor:middle;dominant-baseline:central;fill:#fff;stroke:#1d4d2b;stroke-width:.9;paint-order:stroke;pointer-events:none}
.br-i .seg{fill:none;stroke:rgba(255,255,255,.4);stroke-width:1.15;stroke-linecap:round;pointer-events:none}
.br-i .seg.on{stroke:#FFD34D}
.br-i.ok .grass{fill:url(#brOk)}
.br-i.ok .halo{opacity:.8}
.br-i.ok text{stroke:#8a5a00}
.br-i.over .grass{fill:#E5484D}
.br-i.over .seg.on{stroke:#FF6B73}
.br-i.sel .seg{stroke:#fff}
.brs.won .halo{opacity:1}
.br-drag{stroke:#FFE08A;stroke-width:1.1;stroke-dasharray:1.4 1.2;stroke-linecap:round;pointer-events:none}
.br-key{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.br-key span{display:flex;align-items:center;gap:6px}
.br-key i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:800 11px var(--font-d);font-style:normal;flex:none}
.br-key .kp{background:#fff;color:#0A4F7C;box-shadow:inset 0 0 0 1.5px #0A4F7C}
.br-key .kd{background:#8A5A2B;color:#fff}
.br-key .kg{background:#F6C335;box-shadow:inset 0 0 0 2px #fff}
@media (prefers-reduced-motion:reduce){.br-waves,.br-spark,.br-e.pulse .br-badge circle{animation:none}.br-spark{opacity:.4}}

/* ===== v4: textures, themes, celebration, new games ===== */
body{overflow-x:hidden}
.stagewrap,.stage{overflow:visible}
.cell.grass,.sw-t.grass{background:var(--tx-grass) center/100% 100%}
.cell.jungle,.sw-t.jungle{background:var(--tx-jungle) center/100% 100%}
.cell.rock,.sw-t.rock{background:var(--tx-rock) center/100% 100%}
.cell.mud,.sw-t.mud{background:var(--tx-mud) center/100% 100%}
.cell{border-radius:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.22),0 3px 6px rgba(20,60,30,.28)}
.tok::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.75),rgba(255,255,255,0) 46%);pointer-events:none}
.stage.th-jungle{background:radial-gradient(120% 60% at 15% 0%,#E4F7BF,transparent 60%),linear-gradient(170deg,#A5DC8A,#62B86E 62%,#3E9C66);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 8px 24px rgba(40,110,60,.25);--surface2:rgba(255,255,255,.9);--ink:#143222;--muted:#3a5a46;--line:rgba(0,0,0,.14);--line-strong:rgba(0,0,0,.25)}
.stage.th-alibi{background:var(--tx-stars) 0 0/130px 130px,radial-gradient(circle at 88% 7%,#FFF3C4 0 4.5%,rgba(255,243,196,.28) 5.5% 11%,transparent 12%),linear-gradient(180deg,#221350,#472A86 62%,#6C3FA3);box-shadow:0 8px 26px rgba(70,40,140,.35);--ink:#fff;--muted:#D3C9FF;--surface2:rgba(255,255,255,.14)}
.th-alibi .clue{background:rgba(255,255,255,.93);--ink:#1B1730;--muted:#5b577a;--surface2:#fff}
.th-alibi .al-track{background:rgba(255,255,255,.13)}
.th-alibi .al-cell{box-shadow:inset -1px 0 0 rgba(255,255,255,.18)}
.th-alibi .al-bar{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.55)}
.th-alibi .al-who .tok{box-shadow:inset 0 0 0 3px var(--c),0 0 12px rgba(255,255,255,.25)}
.stage.th-bridge{background:linear-gradient(180deg,#D5F3F6,#A4DDE8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 8px 24px rgba(14,120,150,.22);--muted:#1d5c6b}
.stage.th-lantern{background:radial-gradient(120% 80% at 50% 0%,#2E3F86 0,#151D45 55%,#0A0F26);box-shadow:0 8px 28px rgba(10,15,50,.5);--ink:#F4EEFF;--muted:#B9B4DC}
.th-lantern .ln-count{color:#FFD98A}
.stage.th-lineup{background:radial-gradient(90% 70% at 50% 0%,#4B6594,#242E4C 60%,#151B2E);box-shadow:0 8px 28px rgba(15,22,48,.45);--ink:#EEF1FF;--muted:#C2CAEA}
.th-lineup .clue{background:rgba(255,255,255,.94);--ink:#1B1730;--muted:#5b577a}
.stage.th-untangle{background:radial-gradient(120% 90% at 50% 40%,#2F1E68,#150E3B 68%,#09061F);box-shadow:0 8px 28px rgba(20,10,60,.5);--ink:#F2EEFF;--muted:#BDB4F0}
.th-untangle .ln-count{color:#8DF3FF}
.stage.th-paint{background:radial-gradient(#E6DAC4 1px,transparent 1.3px) 0 0/15px 15px,#FBF6EC;box-shadow:inset 0 0 0 1px #EADFC8,0 8px 24px rgba(90,60,20,.14);--ink:#2a2233;--muted:#6f6579;--surface2:#F0E8D8;--line-strong:#CDBFA6}
/* celebration */
.cele{position:absolute;inset:0;pointer-events:none;z-index:9;display:grid;place-items:center;overflow:visible}
.cf{position:absolute;left:50%;top:44%;width:9px;height:14px;background:var(--c);border-radius:var(--sh);opacity:0;animation:cf var(--t) cubic-bezier(.15,.75,.3,1) .05s both}
@keyframes cf{0%{opacity:1;transform:translate(-50%,-50%) scale(0) rotate(0)}12%{opacity:1;transform:translate(-50%,-50%) scale(var(--s)) rotate(40deg)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--s)) rotate(var(--r))}}
.ring{position:absolute;left:50%;top:44%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:4px solid #FFD23F;opacity:0;animation:ringb .9s ease-out .05s both}
.ring.r2{border-color:#fff;animation-delay:.2s}
@keyframes ringb{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(11)}}
.badge{position:relative;z-index:2;text-align:center;color:#fff;background:rgba(18,14,38,.92);border-radius:24px;padding:14px 28px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 2px rgba(255,210,63,.6);animation:badge .6s cubic-bezier(.2,1.5,.4,1) .12s both}
.badge svg{width:54px;height:54px;display:block;margin:0 auto 4px}
.badge .cc{fill:none;stroke:#FFD23F;stroke-width:3;stroke-dasharray:145;stroke-dashoffset:145;animation:draw .6s ease .3s forwards}
.badge .ck{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .35s ease .7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes badge{from{opacity:0;transform:scale(.4) translateY(20px)}to{opacity:1;transform:none}}
.badge b{display:block;font:800 24px var(--font-d)}
.badge span{font:700 18px var(--font-d);color:#FFD23F;font-variant-numeric:tabular-nums}
.stage.pulse{animation:stagepulse .9s ease}
@keyframes stagepulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,210,63,0)}35%{transform:scale(1.015);box-shadow:0 0 0 6px rgba(255,210,63,.55),0 0 38px rgba(255,210,63,.6)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,210,63,0)}}
.clock.gold{color:#E9A400}
.jgrid.won .tok.on,.al.won .al-bar.on{animation:hop .7s ease}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-8px) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.badge,.stage.pulse,.badge .cc,.badge .ck,.jgrid.won .tok.on{animation:none}.badge .cc,.badge .ck{stroke-dashoffset:0}}
/* lanterns */
.ln-hud{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font:700 13px var(--font-b);color:var(--muted)}
.ln-count{font:800 17px var(--font-d);font-variant-numeric:tabular-nums}
.ln{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;max-width:430px;margin:0 auto}
.ln-f,.ln-w{aspect-ratio:1;border-radius:9px;position:relative;overflow:hidden}
.ln-f{border:0;padding:0;cursor:pointer;background:linear-gradient(160deg,#2B3A75,#1B2552);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.28)}
.ln-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,226,140,.98),rgba(255,176,64,.6) 68%,rgba(255,150,40,.38));opacity:0;transition:opacity .35s ease var(--d,0ms)}
.ln-f.lit .ln-glow{opacity:.8}
.ln-lamp{position:absolute;inset:11%;display:grid;place-items:center;opacity:0;transform:scale(.4) translateY(-8px);transition:opacity .2s,transform .28s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 0 7px #FFB43A)}
.ln-lamp svg{width:100%;height:100%}
.ln-f.has .ln-lamp{opacity:1;transform:none;animation:flick 2.4s ease-in-out infinite}
.ln-f.bad .ln-lamp{filter:drop-shadow(0 0 8px #FF3B4D) hue-rotate(-18deg) saturate(1.5)}
.ln-f.bad{box-shadow:inset 0 0 0 2.5px #FF5470}
.ln-w{background:linear-gradient(160deg,#5E6482,#2E3250);display:grid;place-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 2px 5px rgba(0,0,0,.4)}
.ln-w b{font:800 clamp(16px,5.2vw,25px) var(--font-d);color:#FFD98A;text-shadow:0 0 10px rgba(255,200,90,.85)}
.ln-w.ok b{color:#7CFFB2;text-shadow:0 0 12px rgba(80,255,160,.85)}
.ln-w.bad b{color:#FF7A8A;text-shadow:0 0 12px rgba(255,90,110,.85)}
@keyframes flick{0%,100%{filter:drop-shadow(0 0 6px #FFB43A)}50%{filter:drop-shadow(0 0 12px #FFCB62)}}
.ln.won .ln-glow{opacity:1;animation:winwave 1.1s ease var(--w,0ms) both}
@keyframes winwave{0%{filter:brightness(1)}50%{filter:brightness(1.7) saturate(1.3)}100%{filter:brightness(1.18)}}
.ln.won .ln-lamp{animation:lampwin .9s ease var(--w,0ms) both}
@keyframes lampwin{0%{transform:scale(1)}40%{transform:scale(1.38)}100%{transform:scale(1.08)}}
/* lineup */
.lnclues{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:5px;margin-bottom:10px}
.ln-c{--tk:30px;min-height:70px}
.ln-c .cin{gap:2px}
.lnic{display:block;width:calc(var(--tk)*1.05);height:calc(var(--tk)*1.05);flex:none}
.lnic svg{width:100%;height:100%;display:block}
.ln-c .yes{font-style:normal;background:#18A864;color:#fff;border-radius:50%;width:16px;height:16px;display:grid;place-items:center;font-size:11px;font-weight:800;margin-left:-9px;align-self:flex-end;position:relative;z-index:3}
.orw{font:800 12px var(--font-d);color:#1F7A7A;font-style:normal}
.arw{font:800 16px var(--font-d);color:#1F7A7A;font-style:normal;padding:0 1px}
.neg.two{display:inline-flex;gap:2px;padding:2px 3px}
.lnmini svg{width:48px;height:38px;display:block}
.lng{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:420px;margin:0 auto}
.lnf{position:relative;border:0;padding:0;background:none;border-radius:14px;cursor:pointer;line-height:0;transition:transform .2s,filter .3s,opacity .3s;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.lnf svg{width:100%;height:auto;display:block;border-radius:14px}
.lnf.out{box-shadow:0 0 0 2.5px #E5484D,0 3px 8px rgba(0,0,0,.3)}
.lnf.out::after{content:"\2715";position:absolute;top:-6px;right:-6px;width:21px;height:21px;border-radius:50%;background:#E5484D;color:#fff;display:grid;place-items:center;font:800 12px var(--font-d);line-height:1;box-shadow:0 0 0 2px #fff}
.lng.won .lnf:not(.caught){opacity:.18;filter:grayscale(1);transform:scale(.88)}
.lnf.caught{z-index:3}
.lng.won .lnf.caught{transform:scale(1.2);box-shadow:0 0 0 3px #FFD23F,0 0 30px rgba(255,210,63,.95);animation:caughtpop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes caughtpop{from{transform:scale(.9)}}
.shakeit{animation:shake .35s}
.ln-note{margin-top:10px;text-align:center;font-size:13px;color:var(--muted);font-weight:600}
/* untangle */
.un{max-width:440px;margin:0 auto}
.un-svg{max-height:60vh;border-radius:16px;touch-action:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.un-star{opacity:.15;animation:twinkle 4s ease-in-out infinite}
.un-e line{stroke-linecap:round;fill:none}
.un-e .g{stroke:#6AF0FF;stroke-opacity:.22;stroke-width:2.4}
.un-e .c{stroke:#7DF3FF;stroke-width:.75}
.un-e.bad .g{stroke:#FF4D6A;stroke-opacity:.38}
.un-e.bad .c{stroke:#FF7E96;stroke-width:.9;animation:badpulse 1s ease-in-out infinite}
@keyframes badpulse{50%{stroke-opacity:.45}}
.un-n{cursor:grab}
.un-n .hit{fill:transparent}
.un-n .halo{opacity:.7}
.un-n.drag .halo{opacity:1}
.un-n.drag .dot{filter:drop-shadow(0 0 2px #fff)}
.un-svg.won .un-e .c{stroke:#FFE27A;stroke-width:1.05}
.un-svg.won .un-e .g{stroke:#FFD23F;stroke-opacity:.55}
.un-svg.won .un-n .dot{fill:#FFE27A}
.un-svg.won .un-e{animation:glowin .8s ease}
@keyframes glowin{0%{opacity:.4}100%{opacity:1}}
/* paint layers */
.pt-grid{display:grid;grid-template-columns:.86fr 1.14fr;gap:12px;align-items:start}
.pt-fig{margin:0}
.pt-fig figcaption{font:700 12px var(--font-b);color:var(--muted);text-align:center;margin-top:5px}
.pt-canvas{aspect-ratio:1;background:#fff;border-radius:14px;box-shadow:inset 0 0 0 1.5px #E3D9C5,0 5px 16px rgba(60,40,10,.16);overflow:hidden;line-height:0;cursor:pointer}
.pt-fig.tgt .pt-canvas{cursor:default;box-shadow:inset 0 0 0 1.5px #E3D9C5,0 0 0 3px rgba(255,210,63,.55)}
.pt-svg{width:100%;height:100%;display:block}
.pt-svg .sh{filter:drop-shadow(0 .9px 1.1px rgba(40,25,10,.38));transform-box:fill-box;transform-origin:center}
.pt-svg .sh path,.pt-svg .sh circle,.pt-svg .sh rect,.pt-svg .sh polygon{stroke:rgba(255,255,255,.6);stroke-width:.7}
.sh.pop{animation:shpop .34s cubic-bezier(.2,1.6,.4,1)}
@keyframes shpop{0%{transform:scale(.86)}100%{transform:scale(1)}}
.pt-seg{margin-top:12px}
.pt-stack{display:flex;align-items:center;gap:8px;margin-top:12px;justify-content:center}
.pt-stack small{font:700 11px var(--font-b);color:var(--muted)}
.pt-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pt-chip{width:44px;height:44px;border:0;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px #E3D9C5,0 2px 5px rgba(60,40,10,.12);padding:5px;cursor:grab;touch-action:none}
.pt-chip:active{cursor:grabbing}
.pt-chip svg{width:100%;height:100%;display:block}
.pt-chip.dragging{opacity:.45;transform:scale(1.1);box-shadow:0 8px 18px rgba(60,40,10,.3);z-index:5;position:relative}
.won .pt-svg.live .sh{animation:wiggle .9s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) scale(1.04)}75%{transform:rotate(5deg) scale(1.04)}}
/* picker + home */
.pk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pk{border:0;border-radius:14px;padding:9px 2px 6px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;display:grid;gap:1px;justify-items:center}
.pk b{font:800 20px var(--font-d)}
.pk small{font:600 11px var(--font-b);color:var(--muted);min-height:14px}
.pk.done{background:color-mix(in srgb,var(--ok) 14%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--ok)}
.pk.done b::after{content:" \2713";color:var(--ok);font-size:13px}
.tile .d.prog{margin-top:3px;font-weight:700;color:var(--ok)}

/* ===== v5 ===== */
.foot{display:flex;justify-content:center;margin-top:12px}
.giveup{opacity:.85}
.reveal-tag{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:9;background:#18A864;color:#fff;font:800 13px var(--font-d);padding:6px 14px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:badge .4s cubic-bezier(.2,1.5,.4,1) both}
.stage.revealed{box-shadow:0 0 0 3px #18A864}
.chip.pen{background:var(--you-soft);color:var(--you)}
.tm.gu{background:var(--you-soft);color:var(--you)}
.elo-chip{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:6px 0 4px}
.elo-chip b{font:800 44px var(--font-d);font-variant-numeric:tabular-nums}
.elo-chip span{font:800 18px var(--font-d)}
.brow .sc small{display:block;font:500 12px var(--font-b);color:var(--muted)}
/* lineup fixes */
.ln-c{--tk:36px;min-height:78px}
.lnclues{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
.ln-c .cin{gap:3px;position:relative}
.ln-c .yes,.ln-c .no{font-style:normal;color:#fff;border-radius:50%;width:17px;height:17px;display:grid;place-items:center;font-size:11px;font-weight:800;margin-left:-8px;align-self:flex-end;position:relative;z-index:3;box-shadow:0 0 0 2px #fff}
.ln-c .yes{background:#18A864}
.ln-c .no{background:#E5484D}
.ln-seg{margin:0 0 10px}
.ln-seg button{min-width:112px}
.lng.accusing .lnf:not(.out){cursor:crosshair}
.lng.accusing .lnf:not(.out):hover{transform:translateY(-2px)}
.lnf.last{animation:lastpulse 1.2s ease-in-out infinite}
@keyframes lastpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,0)}50%{box-shadow:0 0 0 4px #FFD23F,0 0 18px rgba(255,210,63,.8)}}
/* bridges: one bridge */
.zpw{max-width:440px;margin:0 auto}
.zp{max-height:58vh;touch-action:none;border-radius:16px;box-shadow:0 6px 22px rgba(10,79,124,.28);cursor:crosshair}
.zp-tile{fill:rgba(255,255,255,.1);stroke:rgba(255,255,255,.18);stroke-width:.25;transition:fill .2s}
.zp-tile.vis{fill:rgba(255,226,140,.3)}
.zp-sh,.zp-base,.zp-plank{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.zp-sh{stroke:#04243A;stroke-opacity:.35;stroke-width:5.2;transform:translate(.5px,.6px)}
.zp-base{stroke:#8A5A2B;stroke-width:4.4}
.zp-plank{stroke:#E6B873;stroke-width:3.6;stroke-dasharray:.9 .55}
.zp-head{fill:#fff;stroke:#FFB43A;stroke-width:.8;pointer-events:none;filter:drop-shadow(0 0 2px #FFD23F)}
.zp-i{pointer-events:none}
.zp-i text{font:800 5.2px var(--font-d);text-anchor:middle;dominant-baseline:central;fill:#fff;stroke:#1d4d2b;stroke-width:.9;paint-order:stroke}
.zp-i.ok .grass{fill:url(#zpOk)}
.zp-i.ok text{stroke:#8a5a00}
.zp-i.next .halo{opacity:.9;animation:nextpulse 1.3s ease-in-out infinite}
@keyframes nextpulse{50%{opacity:.25}}
.zp-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px}
.zp-note{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}
.zp-note.warn{color:var(--bad)}
.zp.won .zp-base{stroke:#E0A100}
.zp.won .zp-plank{stroke:#FFE58A}
.zp-walker{font-size:7px;text-anchor:middle;dominant-baseline:central}
/* hues */
.hu{position:relative;width:100%;max-width:400px;margin:0 auto;aspect-ratio:var(--cols)/var(--rows)}
